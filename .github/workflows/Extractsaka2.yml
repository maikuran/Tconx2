name: Extract Sakalti2 Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP to repository root
        shell: bash
        run: |
          set -euo pipefail

          test -f Sakalti2-src.zip

          unzip -q -o Sakalti2-src.zip -d .

          # ZIP内部に Sakalti2-src/ という親ディレクトリがある場合、
          # その中身をリポジトリ直下へ移動する
          if [ -d "Sakalti2-src" ]; then
            shopt -s dotglob
            cp -a Sakalti2-src/. .
            rm -rf Sakalti2-src
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Sakalti2 source"
          git push
