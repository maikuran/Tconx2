name: Extract Sakalti2 Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP to repository root
        shell: bash
        run: |
          set -e

          tmp_dir="$(mktemp -d)"

          unzip -q "Sakalti2-src.zip" -d "$tmp_dir"

          # ZIP内の最上位ディレクトリが存在する場合、
          # その中身だけをリポジトリ直下へ移動する。
          top_count="$(find "$tmp_dir" -mindepth 1 -maxdepth 1 | wc -l)"

          if [ "$top_count" -eq 1 ] && [ -d "$(find "$tmp_dir" -mindepth 1 -maxdepth 1 -type d)" ]; then
            source_dir="$(find "$tmp_dir" -mindepth 1 -maxdepth 1 -type d)"
            cp -a "$source_dir"/. .
          else
            cp -a "$tmp_dir"/. .
          fi

          rm -rf "$tmp_dir"

      - name: Commit extracted files
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Extract Sakalti2 source"
          git push
