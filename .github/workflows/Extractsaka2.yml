name: Extract Sakalti2 Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Sakalti2-src.zip to repository root
        shell: bash
        run: |
          set -e

          rm -rf .extract_tmp
          mkdir .extract_tmp

          unzip -q Sakalti2-src.zip -d .extract_tmp

          # ZIP内の Sakalti2-src/ を取り除き、
          # 中身をリポジトリ直下へ配置
          if [ -d ".extract_tmp/Sakalti2-src" ]; then
            cp -a .extract_tmp/Sakalti2-src/. .
          else
            cp -a .extract_tmp/. .
          fi

          rm -rf .extract_tmp

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit extracted files
        shell: bash
        run: |
          set -e

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Sakalti2 source"
          git push
